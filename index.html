<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSC426 App</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Tahoma, Geneva, sans-serif; background: #f7f7f7; color: #111; min-height: 100vh; display: flex; flex-direction: column; }
  .topbar { background: white; border-bottom: 1px solid #ddd; padding: 13px 18px; font-size: 15px; font-weight: bold; }
  .topbar span { font-size: 12px; font-weight: normal; color: #888; margin-left: 10px; }
  .view { flex: 1; display: none; padding: 24px 18px; overflow-y: auto; }
  .view.show { display: block; }
  .view h2 { font-size: 15px; margin-bottom: 18px; padding-bottom: 8px; border-bottom: 1px solid #ddd; }
  .screen { background: #fff; border: 1px solid #bbb; text-align: right; padding: 12px 14px; font-size: 28px; min-height: 54px; margin-bottom: 10px; word-break: break-all; }
  .pad { display: grid; grid-template-columns: repeat(4, 1fr); gap: 7px; max-width: 340px; }
  .k { padding: 14px; font-size: 15px; border: none; background: white; cursor: pointer; font-family: Tahoma, sans-serif; border: 1px solid #ccc; }
  .k:active { background: #eee; }
  .k.sp { background: #efefef; }
  .k.cl { background: #e2e2e2; }
  .k.eq { background: #111; color: white; grid-column: span 2; font-size: 17px; border-color: #111; }
  .frm { max-width: 340px; }
  .fl { margin-bottom: 16px; }
  .fl label { display: block; font-size: 13px; margin-bottom: 5px; }
  .fl input { width: 100%; padding: 10px 11px; border: 1px solid #bbb; font-family: Tahoma, sans-serif; font-size: 14px; }
  .fl input:focus { outline: 2px solid #333; }
  .fl .ev { font-size: 12px; color: crimson; display: none; margin-top: 4px; }
  .fl .ev.show { display: block; }
  .fbtn { display: flex; gap: 10px; margin-top: 18px; }
  .fbtn button { flex: 1; padding: 11px; font-size: 14px; font-family: Tahoma, sans-serif; cursor: pointer; border: 1px solid #333; }
  .fbtn .in { background: #111; color: white; }
  .fbtn .in:hover { background: #333; }
  .fbtn .cn { background: white; }
  .fbtn .cn:hover { background: #f2f2f2; }
  .toast { margin-top: 16px; padding: 10px 13px; font-size: 13px; border-left: 4px solid #111; background: #fff; display: none; }
  .toast.err { border-left-color: crimson; color: crimson; }
  .botbar { background: white; border-top: 1px solid #ddd; display: flex; }
  .botbar button { flex: 1; padding: 14px 0 12px; font-size: 12px; font-family: Tahoma, sans-serif; border: none; background: transparent; cursor: pointer; color: #888; border-top: 3px solid transparent; }
  .botbar button.on { color: #111; font-weight: bold; border-top-color: #111; }
  .botbar button:hover { background: #f5f5f5; }
  .ico { display: block; font-size: 18px; margin-bottom: 3px; }
</style>
</head>
<body>
<div class="topbar">CSC426 <span>Practical Work</span></div>

<div class="view show" id="v-calc">
  <h2>Calculator</h2>
  <div class="screen" id="dA">0</div>
  <div class="pad">
    <button class="k cl" onclick="cA()">C</button>
    <button class="k sp" onclick="oA('^')">^</button>
    <button class="k sp" onclick="oA('%')">%</button>
    <button class="k sp" onclick="oA('/')">&#247;</button>
    <button class="k" onclick="nA('7')">7</button>
    <button class="k" onclick="nA('8')">8</button>
    <button class="k" onclick="nA('9')">9</button>
    <button class="k sp" onclick="oA('*')">&#215;</button>
    <button class="k" onclick="nA('4')">4</button>
    <button class="k" onclick="nA('5')">5</button>
    <button class="k" onclick="nA('6')">6</button>
    <button class="k sp" onclick="oA('-')">-</button>
    <button class="k" onclick="nA('1')">1</button>
    <button class="k" onclick="nA('2')">2</button>
    <button class="k" onclick="nA('3')">3</button>
    <button class="k sp" onclick="oA('+')">+</button>
    <button class="k" onclick="nA('0')">0</button>
    <button class="k" onclick="nA('.')">.</button>
    <button class="k eq" onclick="eA()">=</button>
  </div>
</div>

<div class="view" id="v-login">
  <h2>Login</h2>
  <div class="frm">
    <div class="fl">
      <label>Username</label>
      <input type="text" id="uA" autocomplete="off" placeholder="Enter username">
      <div class="ev" id="ueA">Username field is empty.</div>
    </div>
    <div class="fl">
      <label>Password</label>
      <input type="password" id="pA" placeholder="Enter password">
      <div class="ev" id="peA">Password must be 6 or more characters.</div>
    </div>
    <div class="fbtn">
      <button class="in" onclick="lgA()">Login</button>
      <button class="cn" onclick="rsA()">Reset</button>
    </div>
    <div class="toast" id="tA"></div>
  </div>
</div>

<div class="botbar">
  <button class="on" id="tab-calc" onclick="goto('calc')">
    <span class="ico">#</span>Calc
  </button>
  <button id="tab-login" onclick="goto('login')">
    <span class="ico">@</span>Login
  </button>
</div>

<script>
  function goto(which) {
    document.querySelectorAll('.view').forEach(function(v) { v.classList.remove('show'); });
    document.querySelectorAll('.botbar button').forEach(function(b) { b.classList.remove('on'); });
    document.getElementById('v-' + which).classList.add('show');
    document.getElementById('tab-' + which).classList.add('on');
  }

  var exA = '', jcA = false;
  function sdA(v) { document.getElementById('dA').textContent = v || '0'; }
  function nA(d) { if (jcA) { exA=''; jcA=false; } if (d==='.'&&exA.split(/[+\-*/%^]/).pop().includes('.')) return; exA+=d; sdA(exA); }
  function oA(op) { jcA=false; if (!exA&&op!=='-') return; if (exA&&'+-*/%^'.includes(exA.slice(-1))) exA=exA.slice(0,-1); exA+=op; sdA(exA); }
  function cA() { exA=''; jcA=false; sdA('0'); }
  function eA() {
    if (!exA) return;
    try {
      var r=Function('"use strict";return('+exA.replace(/\^/g,'**')+')')(  );
      if (!isFinite(r)) { sdA('Error'); exA=''; return; }
      r=parseFloat(r.toFixed(10)); exA=String(r); sdA(exA); jcA=true;
    } catch(e) { sdA('Error'); exA=''; }
  }

  function lgA() {
    var u=document.getElementById('uA').value.trim(), p=document.getElementById('pA').value;
    var ue=document.getElementById('ueA'), pe=document.getElementById('peA'), t=document.getElementById('tA');
    ue.className='ev'; pe.className='ev'; t.style.display='none';
    var ok=true;
    if (!u) { ue.className='ev show'; ok=false; }
    if (p.length<6) { pe.className='ev show'; ok=false; }
    if (!ok) return;
    t.style.display='block';
    if (u==='admin'&&p==='admin123') { t.className='toast'; t.textContent='Login successful. Welcome, '+u+'.'; }
    else { t.className='toast err'; t.textContent='Login failed. Wrong username or password.'; }
  }

  function rsA() {
    document.getElementById('uA').value=''; document.getElementById('pA').value='';
    document.getElementById('ueA').className='ev'; document.getElementById('peA').className='ev';
    var t=document.getElementById('tA'); t.style.display='none'; t.className='toast';
  }
</script>
</body>
</html>
